name: iOS release (TestFlight)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version shown in TestFlight (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  RESULTS_BRANCH: ci-results

jobs:
  release:
    name: Archive, sign in the cloud, upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: secrets
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DEVELOPMENT_TEAM; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Missing repository secrets:$missing (APPLE_TEAM_ID maps to DEVELOPMENT_TEAM). The archive will be built as a dry run; nothing is signed or uploaded until they are added under Settings > Secrets and variables > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install App Store Connect API key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p ~/private_keys
          if echo "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          else
            echo "$ASC_KEY_P8" | base64 -d > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          fi
          chmod 600 ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "KEY_PATH=$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Register bundle identifiers and capabilities
        if: steps.secrets.outputs.ready == 'true'
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography || pip3 install --quiet pyjwt cryptography
          mkdir -p ios/build
          python3 ios/tools/asc_prepare.py 2>&1 | tee ios/build/asc.log

      - name: Firebase (push notifications), when configured
        working-directory: ios
        env:
          PLIST_B64: ${{ secrets.FIREBASE_PLIST_B64 }}
        run: |
          if [ -z "$PLIST_B64" ]; then echo "FIREBASE_PLIST_B64 not set: building without Firebase (background-refresh alerts still work)"; exit 0; fi
          echo "$PLIST_B64" | base64 -d > PeriopSignal/Resources/GoogleService-Info.plist
          python3 tools/add_firebase.py

      - name: Install XcodeGen and generate the project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Archive (unsigned; signing happens at export with Apple's cloud-managed certificate)
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project PeriopSignal.xcodeproj -scheme PeriopSignal \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/PeriopSignal.xcarchive \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee build/archive.log | grep -E "error:|ARCHIVE|BUILD" | tail -40

      - name: Export and upload to App Store Connect
        if: steps.secrets.outputs.ready == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/PeriopSignal.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee build/export.log | grep -vE "^\s*$" | tail -60

      - name: Summary
        if: always()
        run: |
          {
            echo "## iOS release ${{ inputs.version }} (build ${{ github.run_number }})"
            echo
            if grep -q "EXPORT SUCCEEDED" ios/build/export.log 2>/dev/null; then
              echo "Uploaded to App Store Connect. It appears under TestFlight after Apple finishes processing (usually 5-20 minutes)."
              if [ -f ios/build/export/DistributionSummary.plist ]; then
                echo; echo "Entitlements signed into the upload:"; echo '```'
                plutil -convert xml1 -o - ios/build/export/DistributionSummary.plist | grep -E "aps-environment|ubiquity-kvstore|application-identifier|<string>(production|development)</string>" | head -20
                echo '```'
              fi
            elif [ "${{ steps.secrets.outputs.ready }}" != "true" ]; then
              if grep -q "ARCHIVE SUCCEEDED" ios/build/archive.log 2>/dev/null; then echo "Dry run: the release archive builds. Add the Apple secrets to sign and upload."; else echo "Dry run: the archive failed; see the log below."; tail -40 ios/build/archive.log; fi
            else
              echo "Upload did not complete. Last lines of the export log:"; echo '```'
              tail -40 ios/build/export.log 2>/dev/null || tail -40 ios/build/archive.log 2>/dev/null || echo "(no log)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish logs to the ci-results branch
        if: always()
        run: |
          mkdir -p ci-out
          [ -f ios/build/asc.log ] && cp ios/build/asc.log ci-out/release-asc.log
          for f in archive export; do
            [ -f ios/build/$f.log ] && grep -vE "^\s*$" ios/build/$f.log | grep -E "error|warning: |SUCCEEDED|FAILED|Exported|Upload|signing|profile|certificate" | tail -300 > ci-out/release-$f.log || true
          done
          if [ -f ios/build/export/DistributionSummary.plist ]; then
            plutil -convert xml1 -o ci-out/DistributionSummary.plist ios/build/export/DistributionSummary.plist || cp ios/build/export/DistributionSummary.plist ci-out/
          fi
          ls -la ios/build/export > ci-out/export-dir.txt 2>&1 || true
          echo "run=${{ github.run_number }} version=${{ inputs.version }} status=${{ job.status }}" > ci-out/RELEASE_STATUS
          git config user.name "periop-signal-ci"
          git config user.email "ci@periopsignal.invalid"
          if git fetch origin "$RESULTS_BRANCH" 2>/dev/null; then
            git checkout -B "$RESULTS_BRANCH" "origin/$RESULTS_BRANCH"
          else
            git checkout --orphan "$RESULTS_BRANCH"
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          rm -rf results/release && mkdir -p results/release && cp -R ci-out/. results/release/
          git add -f results/release
          git commit -q -m "Release logs for run ${{ github.run_number }}" || true
          git push origin "$RESULTS_BRANCH" || { git fetch origin "$RESULTS_BRANCH" && git rebase "origin/$RESULTS_BRANCH" && git push origin "$RESULTS_BRANCH"; }
