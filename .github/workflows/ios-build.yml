      - name: Publish results to the ci-results branch
        if: always()
        working-directory: ios
        run: |
          mkdir -p ../ci-out
          cp -R build/shots ../ci-out/ 2>/dev/null || true
          tail -c 200000 build/build.log > ../ci-out/build-tail.log 2>/dev/null || true
          grep -E "error:|warning:" build/build.log | sort | uniq -c | sort -rn | head -200 > ../ci-out/build-issues.log 2>/dev/null || true
          grep -E "error:|Test Case|Executed|TEST|failed" build/test.log | tail -200 > ../ci-out/test-summary.log 2>/dev/null || true
          grep -E ": error: |' failed \(" build/test.log | head -100 > ../ci-out/test-failures.log 2>/dev/null || true
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > ../ci-out/STATUS
          # Crash reports from the simulator runs land in the host's DiagnosticReports.
          mkdir -p ../ci-out/crashes
          find ~/Library/Logs/DiagnosticReports -maxdepth 1 -newer build/build.log -name 'PeriopSignal*' -exec cp {} ../ci-out/crashes/ \; 2>/dev/null || true
          ls ../ci-out/crashes
          cd ..
          # A separate worktree for the results branch, so files the build changed or left behind can't block it.
          publish () {
            git config user.name "periop-signal-ci" || return 1
            git config user.email "ci@periopsignal.invalid" || return 1
            rm -rf ../results-tree
            git fetch origin "$RESULTS_BRANCH" || return 1
            git worktree add -f -B "$RESULTS_BRANCH" ../results-tree "origin/$RESULTS_BRANCH" || return 1
            cd ../results-tree || return 1
            rm -rf results/build && mkdir -p results/build && cp -R "$GITHUB_WORKSPACE/ci-out/." results/build/ || return 1
            git add -f results/build || return 1
            git commit -q -m "Build results for run ${{ github.run_number }}" || true
            # Parallel runs all replace results/build, so a rebase onto another run's results always conflicts.
            # On a rejected push, start again from the newest results commit and copy this run's results over it.
            for attempt in 1 2 3 4 5 6; do
              git push origin "HEAD:$RESULTS_BRANCH" && return 0
              sleep $(( attempt * 4 + RANDOM % 7 ))
              git fetch origin "$RESULTS_BRANCH" || continue
              git reset -q --hard "origin/$RESULTS_BRANCH" || return 1
              rm -rf results/build && mkdir -p results/build && cp -R "$GITHUB_WORKSPACE/ci-out/." results/build/ || return 1
              git add -f results/build || return 1
              git commit -q -m "Build results for run ${{ github.run_number }}" || true
            done
            return 1
          }
          if ! publish > "$GITHUB_WORKSPACE/publish.log" 2>&1; then
            cat "$GITHUB_WORKSPACE/publish.log"
            # Logs can't always be downloaded; annotations can, so the reason is visible either way.
            tail -n 12 "$GITHUB_WORKSPACE/publish.log" | while IFS= read -r line; do echo "::error title=Publish results::${line}"; done
            exit 1
          fi
          cat "$GITHUB_WORKSPACE/publish.log"
