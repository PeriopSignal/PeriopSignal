          shot 230-wave2a-airway-ref 12 -ps.ref quickref:asa-difficult-airway -ps.forceAppearance dark
          shot 231-wave2a-fasting-ref 12 -ps.ref quickref:asa-fasting -ps.forceAppearance light
          shot 232-wave2a-acls-info 12 -ps.ref acls -ps.evidence.open 1 -ps.forceAppearance light
          shot 233-wave2a-regional-empty 12 -ps.ref regional-finder -ps.forceAppearance dark
          shot 234-wave2a-ob-hypertension 12 -ps.ref ob -ps.ob.event hypertension -ps.forceAppearance light
          shot 235-wave2a-chamber-info 18 -ps.ref chamber -ps.echo.group rvf -ps.echo.values "tapse=1.5" -ps.echo.pasp 45 -ps.echo.scroll coupling -ps.evidence.open 1 -ps.forceAppearance dark
          shot 236-wave2a-local-info 12 -ps.ref local -ps.la.weight 70 -ps.evidence.open 1 -ps.forceAppearance light
          shot 237-wave2a-neuraxial-info 12 -ps.ref neuraxial-guide -ps.nx.proc cesarean -ps.evidence.open 1 -ps.forceAppearance dark
          shot 238-wave2a-abg-normal 12 -ps.ref abg -ps.abg.values "ph=7.40,paco2=40,hco3=24" -ps.forceAppearance light
          shot 239-wave2a-ponv-info 12 -ps.ref ponv -ps.ponv.factors "female,nonsmoker,opioids" -ps.ponv.agents "ondansetron,dexamethasone" -ps.evidence.open 1 -ps.forceAppearance dark
          # 1.8.1 wave 3 (My Patient editors, 250-259): each moved explanation opened (-ps.evidence.open 1).
          shot 250-wave3-assessment-info 18 -ps.tab patient -ps.patient demo -ps.patient.open assessment -ps.evidence.open 1 -ps.forceAppearance dark
          shot 251-wave3-code-status-info 18 -ps.tab patient -ps.patient demo-dnr -ps.patient.open assessment -ps.patient.scroll codestatus -ps.evidence.open 1 -ps.forceAppearance light
          shot 252-wave3-intraop-airway-info 16 -ps.tab patient -ps.patient demo -ps.patient.open intraop:airway -ps.evidence.open 1 -ps.forceAppearance light
          shot 253-wave3-tee-info 14 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open workup:tee -ps.evidence.open 1 -ps.forceAppearance light
          shot 254-wave3-note-compose-info 14 -ps.tab patient -ps.patient empty -ps.patient.open note -ps.evidence.open 1 -ps.forceAppearance dark
          shot 255-wave3-note-check-info 16 -ps.tab patient -ps.patient empty -ps.patient.open note -ps.patient.note example -ps.evidence.open 1 -ps.forceAppearance light
          shot 256-wave3-end-case-info 16 -ps.tab patient -ps.patient demo-rooms -ps.patient.open end-case -ps.evidence.open 1 -ps.forceAppearance light
          shot 257-wave3-airway-secured-info 16 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open airway -ps.patient.scroll done -ps.evidence.open 1 -ps.forceAppearance dark
          shot 258-wave3-procedure-info 14 -ps.tab patient -ps.patient demo -ps.patient.open procedure -ps.patient.addproc TKA -ps.evidence.open 1 -ps.forceAppearance light
          shot 259-wave3-support-empty-info 18 -ps.tab patient -ps.patient demo -ps.patient.open devices:support -ps.patient.scroll done -ps.evidence.open 1 -ps.forceAppearance dark
          # 1.8.1 features (260-269): Trivial regurgitation, infusions typed in one line, the Foley, Bentall's valve, the
