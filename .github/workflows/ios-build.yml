name: iOS build

on:
  workflow_dispatch:
    inputs:
      with_firebase:
        description: "Include Firebase Messaging (needs the FIREBASE_PLIST_B64 secret)"
        default: "false"
      shots:
        description: "Only the screenshots whose names match this pattern (empty: all)"
        default: ""
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - "reference.json"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SIM_NAME: iPhone 16 Pro
  RESULTS_BRANCH: ci-results

jobs:
  build:
    name: Build, test and screenshot in the simulator
    runs-on: macos-15-intel   # Intel pool; the arm64 (macos-15 / macos-latest) pool has been capacity-constrained and jobs were never acquired
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # newest stable Xcode on the image
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Optional Firebase
        if: inputs.with_firebase == 'true'
        working-directory: ios
        env:
          PLIST_B64: ${{ secrets.FIREBASE_PLIST_B64 }}
        run: |
          if [ -z "$PLIST_B64" ]; then echo "::warning::with_firebase requested but FIREBASE_PLIST_B64 is not set"; exit 0; fi
          echo "$PLIST_B64" | base64 -d > PeriopSignal/Resources/GoogleService-Info.plist
          python3 tools/add_firebase.py

      - name: Generate project
        working-directory: ios
        env:
          DEVELOPMENT_TEAM: ""
        run: xcodegen generate --spec project.yml

      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available | grep -i "iPhone" || true
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,os
          want=os.environ["SIM_NAME"]
          d=json.load(sys.stdin)["devices"]
          found=[]
          for rt,devs in d.items():
              if "iOS" not in rt: continue
              for dev in devs:
                  if dev.get("isAvailable") and dev["name"]==want: found.append((rt,dev["udid"]))
          if not found:
              for rt,devs in d.items():
                  if "iOS" not in rt: continue
                  for dev in devs:
                      if dev.get("isAvailable") and dev["name"].startswith("iPhone"): found.append((rt,dev["udid"]))
          found.sort()
          print(found[-1][1] if found else "")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $UDID"
          test -n "$UDID"

      - name: Build (Debug, simulator)
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project PeriopSignal.xcodeproj -scheme PeriopSignal \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/build.log | grep -E "error:|warning: unre|BUILD|Compiling|Linking" | tail -80

      - name: Unit tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PeriopSignal.xcodeproj -scheme PeriopSignal \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            test 2>&1 | tee build/test.log | grep -E "error:|failed|Executed|TEST" | tail -60

      - name: Screenshots
        working-directory: ios
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          mkdir -p build/shots
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          FEED=$(curl -sL "https://periopsignal.github.io/PeriopSignal/posts.json")
          LANDMARK=$(echo "$FEED" | python3 -c 'import json,sys; d=json.load(sys.stdin); ps=d["posts"]; print(next((p["id"] for p in ps if p.get("impact")==3 and p.get("glance") and p.get("quiz")), next(p["id"] for p in ps if p.get("impact")==3)))')
          LIMITS=$(echo "$FEED" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["id"] for p in d["posts"] if p.get("authorLimitations") and p.get("authorBasis")=="full text"))')
          ONLY="${{ inputs.shots }}"
          diag () { # name: a stack sample of the app and its recent log, for a screen that does not draw
            if [ -n "$ONLY" ] && ! echo "$1" | grep -Eq "$ONLY"; then return 0; fi
            local pid; pid=$(pgrep -f "PeriopSignal.app/PeriopSignal" | head -1)
            if [ -n "$pid" ]; then sample "$pid" 2 -file "build/shots/$1-sample.txt" >/dev/null 2>&1 || true; else echo "no process" > "build/shots/$1-sample.txt"; fi
            xcrun simctl spawn "$UDID" log show --last 1m --style compact --predicate 'process == "PeriopSignal"' > "build/shots/$1-log.txt" 2>/dev/null || true
          }
          shot () { # name, wait, launch args...
            local name="$1"; local wait="$2"; shift 2
            if [ -n "$ONLY" ] && ! echo "$name" | grep -Eq "$ONLY"; then return 0; fi
            xcrun simctl terminate "$UDID" org.periopsignal.app 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" org.periopsignal.app "$@" >/dev/null || echo "::warning::launch failed for $name"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "build/shots/$name.png"
            # The app is gone (it crashed): keep the newest crash report for this shot.
            if ! pgrep -f "PeriopSignal.app/PeriopSignal" >/dev/null; then
              crash=$(ls -t ~/Library/Logs/DiagnosticReports/PeriopSignal*.ips 2>/dev/null | head -1)
              if [ -n "$crash" ]; then cp "$crash" "build/shots/$name-crash.ips"; else echo "app not running, no crash report" > "build/shots/$name-crash.txt"; fi
              xcrun simctl spawn "$UDID" log show --last 1m --style compact --predicate 'process == "PeriopSignal"' > "build/shots/$name-log.txt" 2>/dev/null || true
            fi
            # Nothing drawn yet (a blank frame): record why, then try twice more. A blank frame shrinks to a tiny file
            # once scaled down, whatever the screen's resolution.
            blank () { sips -Z 300 "build/shots/$name.png" --out /tmp/ps-check.png >/dev/null 2>&1; [ "$(stat -f%z /tmp/ps-check.png 2>/dev/null || echo 0)" -lt 7000 ]; }
            for retry in 1 2; do
              if blank; then
                [ "$retry" = 1 ] && diag "$name"
                sleep 12
                xcrun simctl io "$UDID" screenshot "build/shots/$name.png"
              fi
            done
          }
          shot 01-feed 18
          shot 02-deepdive 12 -ps.openPost "$LANDMARK"
          shot 03-deepdive-limits 12 -ps.openPost "$LIMITS"
          shot 04-saved 12 -ps.presave "$LANDMARK" -ps.tab saved
          shot 05-more 10 -ps.tab more
          shot 06-widgets 12 -ps.screen widget
          shot 07-feed-day 12 -ps.forceAppearance light -ps.forceLaunchCount 2
          shot 08-cards 12 -ps.screen cards
          shot 09-welcome 13 -ps.showWelcome 1 -ps.forceAppearance dark
          shot 10-quiz 13 -ps.openQuiz 1
          shot 11-reference 12 -ps.tab reference
          shot 12-listen 13 -ps.listen 1
          shot 13-sharecard 13 -ps.screen sharecard
          shot 14-feed-foryou 13 -ps.topics.debug cardiac,criticalCare -ps.forceLaunchCount 5
          shot 15-rcri 12 -ps.ref score:rcri
          shot 16-peds 12 -ps.ref peds -ps.peds.weight 18 -ps.peds.years 5 -ps.peds.months 0
          shot 17-quickref 12 -ps.ref quickref:asra-anticoagulation
          shot 18-ariscat 12 -ps.ref score:ariscat
          shot 19-local 12 -ps.ref local -ps.la.weight 70
          shot 20-infusions 12 -ps.ref infusions -ps.la.weight 70
          shot 21-preop 12 -ps.ref folder:preoperative
          shot 22-neuraxial 12 -ps.ref neuraxial
          shot 23-fasting 12 -ps.ref fasting
          shot 24-last 12 -ps.ref quickref:asra-last -ps.la.weight 70
          shot 25-airway 12 -ps.ref airway
          shot 26-valves 12 -ps.ref valves
          shot 27-intervention 12 -ps.ref intervention
          shot 28-favorites 12 -ps.tab reference -ps.favorites.debug "valves,neuraxial,score:rcri"
          shot 29-regional 12 -ps.ref folder:regional
          shot 30-ponv 12 -ps.ref ponv -ps.ponv.factors "female,nonsmoker,opioids" -ps.ponv.agents "ondansetron,dexamethasone"
          shot 31-blood 12 -ps.ref infusions -ps.la.weight 70 -ps.inf.tab "Blood Products"
          shot 36-hematologic 12 -ps.ref infusions -ps.inf.tab Hematologic
          shot 37-medications-empty 12 -ps.ref infusions
          shot 32-local-empty 12 -ps.ref local
          shot 33-last-empty 12 -ps.ref quickref:asra-last
          shot 35-cardiothoracic 12 -ps.ref folder:cardiothoracic
          shot 38-chamber-rv 12 -ps.ref chamber -ps.echo.group rv -ps.echo.height 178 -ps.echo.weight 82 -ps.echo.values "rvb=4.5,rvm=3.9"
          shot 39-chamber-aorta 12 -ps.ref chamber -ps.echo.sex female -ps.echo.group ao -ps.echo.age 55 -ps.echo.height 165 -ps.echo.weight 60 -ps.echo.values "sov=3.6"
          shot 40-chamber-lv 12 -ps.ref chamber -ps.forceAppearance light -ps.echo.values "lvef=45,lvidd=60"
          shot 41-diastolic 12 -ps.ref diastolic -ps.dd.values "E=100,A=80,eSeptal=5,eLateral=6,tr=3.1"
          shot 42-diastolic-mac 12 -ps.ref diastolic -ps.dd.pop mac -ps.dd.values "E=80,A=80,ivrt=70"
          shot 43-acls 12 -ps.ref acls
          shot 44-acls-child 12 -ps.ref acls -ps.acls.patient child -ps.acls.weight 18
          shot 45-acls-cals 12 -ps.ref acls -ps.acls.mode cals
          shot 46-acls-tachy 12 -ps.ref acls -ps.acls.mode tachy -ps.forceAppearance light
          shot 47-acls-anaphylaxis 12 -ps.ref acls -ps.acls.mode anaphylaxis
          shot 48-abg-metabolic 12 -ps.ref abg -ps.abg.values "ph=7.28,paco2=30,hco3=14"
          shot 49-abg-respiratory 12 -ps.ref abg -ps.forceAppearance light -ps.abg.values "ph=7.29,paco2=60,hco3=28.5"
          shot 50-regional-finder 12 -ps.ref regional-finder -ps.rg.sel "knee:R,hip:R,lower-abdomen:M"
          shot 51-regional-back 12 -ps.ref regional-finder -ps.forceAppearance light -ps.rg.view back -ps.rg.sel "lumbar-spine:M,back-chest:L"
          shot 52-blocks 12 -ps.ref blocks -ps.blk.group upper -ps.blk.open interscalene
          shot 53-blocks-lower 12 -ps.ref blocks -ps.forceAppearance light -ps.blk.group lower -ps.blk.open popliteal-sciatic
          shot 54-neuraxial-guide 12 -ps.ref neuraxial-guide -ps.nx.proc cesarean
          shot 55-ob-arrest 12 -ps.ref ob -ps.ob.event arrest -ps.la.weight 80
          shot 56-ob-newborn 12 -ps.ref ob -ps.forceAppearance light -ps.ob.event newborn -ps.ob.newborn 3.2
          shot 57-ob-hypertension 12 -ps.ref ob -ps.ob.event hypertension
          shot 58-patient 16 -ps.tab patient -ps.patient demo
          shot 59-patient-empty 16 -ps.tab patient -ps.forceAppearance light
          shot 60-patient-assessment 18 -ps.tab patient -ps.patient demo -ps.patient.open assessment
          shot 61-patient-airway 18 -ps.tab patient -ps.patient demo -ps.patient.open airway -ps.forceAppearance light
          shot 62-patient-intraop 18 -ps.tab patient -ps.patient demo -ps.patient.open intraop
          shot 63-patient-handoff 12 -ps.tab patient -ps.patient demo -ps.patient.open handoff
          shot 64-patient-rcri 12 -ps.tab patient -ps.patient demo -ps.patient.open score:ariscat
          shot 65-patient-local 12 -ps.tab patient -ps.patient demo -ps.patient.open local
          shot 66-more-saved 12 -ps.tab more
          shot 67-patient-cardiac 18 -ps.tab patient -ps.patient demo -ps.patient.open assessment -ps.patient.scroll cardiac
          shot 68-patient-mask 18 -ps.tab patient -ps.patient demo -ps.patient.open airway -ps.patient.scroll mask -ps.forceAppearance light
          shot 69-patient-meds 12 -ps.tab patient -ps.patient demo -ps.patient.open medications
          shot 70-terms 16 -ps.terms show
          shot 71-patient-handoff-short 12 -ps.tab patient -ps.patient demo -ps.patient.open handoff -ps.handoff.format short
          shot 72-patient-done 12 -ps.tab patient -ps.patient demo -ps.patient.open details -ps.patient.scroll done
          shot 73-patient-note 14 -ps.tab patient -ps.patient.open note -ps.patient.note example
          shot 74-patient-note-compose 12 -ps.tab patient -ps.patient.open note -ps.forceAppearance light
          shot 75-patient-receive 12 -ps.tab patient -ps.patient.open receive
          shot 76-patient-top-light 12 -ps.tab patient -ps.patient demo -ps.forceAppearance light
          shot 77-chamber-coupling 18 -ps.ref chamber -ps.echo.group rvf -ps.echo.values "tapse=1.5" -ps.echo.pasp 45 -ps.echo.scroll coupling
          shot 78-chamber-annuli 15 -ps.ref chamber -ps.echo.group annuli -ps.echo.height 178 -ps.echo.weight 82 -ps.echo.values "ma=38,maratio=1.4,ta=42"
          shot 87-blocks-pifb 15 -ps.ref blocks -ps.blk.group chest -ps.blk.open pifb
          shot 88-feed-chips 14 -ps.topics '(regional)' -ps.hiddenTopics '(cardiac,ob)'
          shot 89-apfel 12 -ps.ref score:apfel
          shot 90-rcri-evidence 12 -ps.ref score:rcri -ps.evidence.open 1
          shot 91-patient-assessment-evidence 18 -ps.tab patient -ps.patient demo -ps.patient.open assessment -ps.evidence.open 1
          shot 92-infusions-evidence 12 -ps.ref infusions -ps.la.weight 70 -ps.evidence.open 1
          shot 93-patient-intraop-tab 12 -ps.tab patient -ps.patient demo -ps.patient.tab intraop
          shot 94-patient-summary-tab 12 -ps.tab patient -ps.patient demo -ps.patient.tab summary
          shot 95-patient-procedure 12 -ps.tab patient -ps.patient demo -ps.patient.open procedure
          shot 96-patient-demographics 12 -ps.tab patient -ps.patient demo -ps.patient.open demographics
          shot 97-patient-history 12 -ps.tab patient -ps.patient demo -ps.patient.open history
          shot 98-patient-echo 12 -ps.tab patient -ps.patient demo -ps.patient.open workup:echo
          shot 99-patient-lhc 12 -ps.tab patient -ps.patient demo -ps.patient.open workup:lhc
          shot 100-patient-surgeries 12 -ps.tab patient -ps.patient demo -ps.patient.open workup:surgeries
          shot 101-patient-events 18 -ps.tab patient -ps.patient demo -ps.patient.open intraop:events
          shot 102-patient-preop-light 12 -ps.tab patient -ps.patient demo -ps.patient.tab preop -ps.forceAppearance light
          shot 103-cardiac-preop 12 -ps.tab patient -ps.patient demo-cardiac -ps.patient.tab preop
          shot 104-cardiac-devices 18 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open devices:preop
          shot 105-cardiac-summary 12 -ps.tab patient -ps.patient demo-cardiac -ps.patient.tab summary
          shot 106-cardiac-support 18 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open devices:support -ps.forceAppearance light
          shot 107-cardiac-labs 18 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open workup:labs
          shot 108-cardiac-rhc 12 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open workup:rhc
          shot 109-patient-intraop-labs 18 -ps.tab patient -ps.patient demo -ps.patient.open intraop:labs
          shot 110-cardiac-intraop-labs 18 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open intraop:labs
          shot 111-cardiac-blood 18 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open intraop:fluids
          shot 112-patient-considerations 12 -ps.tab patient -ps.patient demo -ps.patient.open intraop:considerations
          shot 113-cardiac-intraop-tab 12 -ps.tab patient -ps.patient demo-cardiac -ps.patient.tab intraop
          shot 114-dnr-code-status 18 -ps.tab patient -ps.patient demo-dnr -ps.patient.open assessment -ps.patient.scroll codestatus
          shot 115-dnr-handoff 12 -ps.tab patient -ps.patient demo-dnr -ps.patient.open handoff
          shot 116-dnr-handoff-short 12 -ps.tab patient -ps.patient demo-dnr -ps.patient.open handoff -ps.handoff.format short
          shot 117-patient-note-code 14 -ps.tab patient -ps.patient.open note -ps.patient.note "78 yo F for TAVR. DNR/DNI, POLST on file; DNR suspended for the procedure."
          shot 118-cardiac-handoff-short 12 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open handoff -ps.handoff.format short
          shot 119-cardiac-intraop-cards 14 -ps.tab patient -ps.patient demo-cardiac -ps.patient.tab intraop -ps.patient.jump intraop:fluids
          shot 150-patient-considerations-card 14 -ps.tab patient -ps.patient demo -ps.patient.tab intraop -ps.patient.jump intraop:considerations
          shot 151-cardiac-handoff-short-text 14 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open handoff -ps.handoff.format short -ps.patient.jump handoff
          shot 152-cardiac-handoff-full-text 14 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open handoff -ps.handoff.format full -ps.patient.jump handoff
          shot 153-dnr-preop-assessment 14 -ps.tab patient -ps.patient demo-dnr -ps.patient.tab preop -ps.patient.jump assessment
          # 1.8 quick-add bar: -ps.quickadd types a line into the bar (its chips show); -ps.quickadd.add 1 then adds it.
          # Each sets its appearance (-ps.forceAppearance applies to its own launch only).
          shot 160-quickadd-preop 16 -ps.tab patient -ps.patient.tab preop -ps.forceAppearance dark -ps.quickadd "68M for lap chole, HTN DM2 on insulin, K 5.4 Cr 1.6, A-line L radial 20G"
          shot 161-quickadd-preop-demo-light 16 -ps.tab patient -ps.patient demo -ps.patient.tab preop -ps.forceAppearance light -ps.quickadd "68M for lap chole, HTN DM2 on insulin, K 5.4 Cr 1.6, A-line L radial 20G"
          shot 162-quickadd-intraop 22 -ps.tab patient -ps.patient demo -ps.patient.tab intraop -ps.forceAppearance dark -ps.quickadd "2 PRBC, ABG 7.29/41/168, epi 0.05"
          shot 163-quickadd-intraop-light 22 -ps.tab patient -ps.patient demo -ps.patient.tab intraop -ps.forceAppearance light -ps.quickadd "2 PRBC, ABG 7.29/41/168, epi 0.05"
          shot 164-quickadd-vitals-labs 16 -ps.tab patient -ps.patient demo -ps.patient.tab preop -ps.forceAppearance dark -ps.quickadd "148/86 72 95% 16 36.8, 138/4.1/102/24/18/1.1/162, 7.2>12.1/36<210"
          shot 165-quickadd-identifier 16 -ps.tab patient -ps.patient.tab preop -ps.forceAppearance dark -ps.quickadd "MRN 1234567 72M for CABG x3 + AVR, EF 35%, no A-line, POEC"
          shot 166-quickadd-airway-blood 16 -ps.tab patient -ps.patient demo -ps.patient.tab intraop -ps.forceAppearance dark -ps.quickadd "VL grade 1, 7.5 ETT 23 cm, easy mask, cryo 10, 1 pool cryo, cell saver 450, R radial A-line 20G"
          shot 167-quickadd-rest-light 16 -ps.tab patient -ps.patient demo -ps.patient.tab preop -ps.forceAppearance light
          shot 168-quickadd-added 16 -ps.tab patient -ps.patient demo -ps.patient.tab intraop -ps.forceAppearance light -ps.quickadd "2 PRBC, ABG 7.29/41/168, epi 0.05" -ps.quickadd.add 1
          shot 169-quickadd-cardiac-intraop 16 -ps.tab patient -ps.patient demo-cardiac -ps.patient.tab intraop -ps.forceAppearance dark -ps.quickadd "plt 1, +2 FFP, cryo 2, iCa 1.02 K 5.6 Cr 1.9, levo 0.1, vaso 0.04, 2 PRBC available"
          shot 120-cardiac-tee 12 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open workup:tee
          shot 121-cardiac-tee-evidence 15 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open workup:tee -ps.evidence.open 1 -ps.patient.scroll done
          shot 122-cardiac-tee-light 12 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open workup:tee -ps.forceAppearance light
          shot 123-cardiac-assessment-tee 18 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open assessment -ps.patient.scroll cardiac
          shot 140-patient-ecg 12 -ps.tab patient -ps.patient demo -ps.patient.open workup:ecg
          shot 130-rooms 12 -ps.tab patient -ps.patient demo-rooms
          shot 131-rooms-cvor-light 12 -ps.tab patient -ps.patient demo-rooms -ps.patient.case 2 -ps.forceAppearance light
          shot 132-rooms-ep-no-phone 12 -ps.tab patient -ps.patient demo-rooms -ps.patient.case 3
          shot 133-rooms-room 14 -ps.tab patient -ps.patient demo-rooms -ps.patient.open room
          shot 134-rooms-end-case 14 -ps.tab patient -ps.patient demo-rooms -ps.patient.open end-case
          shot 135-rooms-archive 14 -ps.tab patient -ps.patient demo-rooms -ps.patient.open archive
          shot 136-rooms-archive-entry 15 -ps.tab patient -ps.patient demo-rooms -ps.patient.open archive-entry -ps.forceAppearance light
          shot 137-rooms-handoff 12 -ps.tab patient -ps.patient demo-rooms -ps.patient.case 2 -ps.patient.tab summary
          shot 138-rooms-receive 14 -ps.tab patient -ps.patient demo-rooms -ps.patient.open receive
          ls -la build/shots
          for f in build/shots/*.png; do sips -Z 900 "$f" >/dev/null; done

      - name: Publish results to the ci-results branch
        if: always()
        working-directory: ios
        run: |
          mkdir -p ../ci-out
          cp -R build/shots ../ci-out/ 2>/dev/null || true
          tail -c 200000 build/build.log > ../ci-out/build-tail.log 2>/dev/null || true
          grep -E "error:|warning:" build/build.log | sort | uniq -c | sort -rn | head -200 > ../ci-out/build-issues.log 2>/dev/null || true
          grep -E "error:|Test Case|Executed|TEST|failed" build/test.log | tail -200 > ../ci-out/test-summary.log 2>/dev/null || true
          grep -E ": error: |' failed \(" build/test.log | head -100 > ../ci-out/test-failures.log 2>/dev/null || true
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > ../ci-out/STATUS
          # Crash reports from the simulator runs land in the host's DiagnosticReports.
          mkdir -p ../ci-out/crashes
          find ~/Library/Logs/DiagnosticReports -maxdepth 1 -newer build/build.log -name 'PeriopSignal*' -exec cp {} ../ci-out/crashes/ \; 2>/dev/null || true
          ls ../ci-out/crashes
          cd ..
          # A separate worktree for the results branch, so files the build changed or left behind can't block it.
          publish () {
            git config user.name "periop-signal-ci" || return 1
            git config user.email "ci@periopsignal.invalid" || return 1
            rm -rf ../results-tree
            git fetch origin "$RESULTS_BRANCH" || return 1
            git worktree add -f -B "$RESULTS_BRANCH" ../results-tree "origin/$RESULTS_BRANCH" || return 1
            cd ../results-tree || return 1
            rm -rf results/build && mkdir -p results/build && cp -R "$GITHUB_WORKSPACE/ci-out/." results/build/ || return 1
            git add -f results/build || return 1
            git commit -q -m "Build results for run ${{ github.run_number }}" || true
            for attempt in 1 2 3; do
              git push origin "HEAD:$RESULTS_BRANCH" && return 0
              sleep 5
              git fetch origin "$RESULTS_BRANCH" && git rebase "origin/$RESULTS_BRANCH" || git rebase --abort || true
            done
            return 1
          }
          if ! publish > "$GITHUB_WORKSPACE/publish.log" 2>&1; then
            cat "$GITHUB_WORKSPACE/publish.log"
            # Logs can't always be downloaded; annotations can, so the reason is visible either way.
            tail -n 12 "$GITHUB_WORKSPACE/publish.log" | while IFS= read -r line; do echo "::error title=Publish results::${line}"; done
            exit 1
          fi
          cat "$GITHUB_WORKSPACE/publish.log"
