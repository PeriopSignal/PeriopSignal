name: iOS build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "GitHub macOS runner label (macos-15 has Xcode 26, needed to upload; macos-14 acquires faster but cannot upload)"
        default: "macos-15-intel"
      with_firebase:
        description: "Include Firebase Messaging (needs the FIREBASE_PLIST_B64 secret)"
        default: "false"
      shots:
        description: "Only the screenshots whose names match this pattern (empty: all)"
        default: ""
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - "reference.json"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SIM_NAME: iPhone 16 Pro
  RESULTS_BRANCH: ci-results

jobs:
  build:
    name: Build, test and screenshot in the simulator
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}   # a dispatch input, so a pool that is not acquiring jobs can be swapped without a commit; uploads need Xcode 26 (iOS 26 SDK), which only the macos-15 images carry
    timeout-minutes: 350   # the full screenshot set (about 520 shots in 1.10) runs past four hours on macos-15-intel; split it with the shots input when you can (hosted runners stop at 360)
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # newest stable Xcode on the image
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Optional Firebase
        if: inputs.with_firebase == 'true'
        working-directory: ios
        env:
          PLIST_B64: ${{ secrets.FIREBASE_PLIST_B64 }}
        run: |
          if [ -z "$PLIST_B64" ]; then echo "::warning::with_firebase requested but FIREBASE_PLIST_B64 is not set"; exit 0; fi
          echo "$PLIST_B64" | base64 -d > PeriopSignal/Resources/GoogleService-Info.plist
          python3 tools/add_firebase.py

      - name: Generate project
        working-directory: ios
        env:
          DEVELOPMENT_TEAM: ""
        run: xcodegen generate --spec project.yml

      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available | grep -i "iPhone" || true
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,os
          want=os.environ["SIM_NAME"]
          d=json.load(sys.stdin)["devices"]
          found=[]
          for rt,devs in d.items():
              if "iOS" not in rt: continue
              for dev in devs:
                  if dev.get("isAvailable") and dev["name"]==want: found.append((rt,dev["udid"]))
          if not found:
              for rt,devs in d.items():
                  if "iOS" not in rt: continue
                  for dev in devs:
                      if dev.get("isAvailable") and dev["name"].startswith("iPhone"): found.append((rt,dev["udid"]))
          found.sort()
          print(found[-1][1] if found else "")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $UDID"
          test -n "$UDID"

      - name: Build (Debug, simulator)
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project PeriopSignal.xcodeproj -scheme PeriopSignal \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/build.log | grep -E "error:|warning: unre|BUILD|Compiling|Linking" | tail -80

      - name: Unit tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PeriopSignal.xcodeproj -scheme PeriopSignal \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            test 2>&1 | tee build/test.log | grep -E "error:|failed|Executed|TEST" | tail -60

      - name: Screenshots
        working-directory: ios
        # Passed in the environment: an expression inside this long script would count its whole text against
        # GitHub's 21,000-character expression limit.
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
          # A push to main takes a smoke set (01-29): the full set runs past the job limit on macos-15-intel, so it is
          # dispatched in parts with the shots input instead.
          SHOTS_ONLY: ${{ github.event_name == 'push' && '^(0[1-9]|1[0-9]|2[0-9])-' || inputs.shots }}
        run: |
          UDID="$SIM_UDID"
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          mkdir -p build/shots
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          FEED=$(curl -sL "https://periopsignal.github.io/PeriopSignal/posts.json")
          LANDMARK=$(echo "$FEED" | python3 -c 'import json,sys; d=json.load(sys.stdin); ps=d["posts"]; print(next((p["id"] for p in ps if p.get("impact")==3 and p.get("glance") and p.get("quiz")), next(p["id"] for p in ps if p.get("impact")==3)))')
          LIMITS=$(echo "$FEED" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["id"] for p in d["posts"] if p.get("authorLimitations") and p.get("authorBasis")=="full text"))')
          ONLY="$SHOTS_ONLY"
          diag () { # name: a stack sample of the app and its recent log, for a screen that does not draw
            if [ -n "$ONLY" ] && ! echo "$1" | grep -Eq "$ONLY"; then return 0; fi
            local pid; pid=$(pgrep -f "PeriopSignal.app/PeriopSignal" | head -1)
            if [ -n "$pid" ]; then sample "$pid" 2 -file "build/shots/$1-sample.txt" >/dev/null 2>&1 || true; else echo "no process" > "build/shots/$1-sample.txt"; fi
            xcrun simctl spawn "$UDID" log show --last 1m --style compact --predicate 'process == "PeriopSignal"' > "build/shots/$1-log.txt" 2>/dev/null || true
          }
          shot () { # name, wait, launch args...
            local name="$1"; local wait="$2"; shift 2
            if [ -n "$ONLY" ] && ! echo "$name" | grep -Eq "$ONLY"; then return 0; fi
            xcrun simctl terminate "$UDID" org.periopsignal.app 2>/dev/null || true
            # Launch only once the last run has exited: a launch while it is still going comes up without its arguments
            # (the plain Feed, in the default appearance).
            for _ in $(seq 1 30); do pgrep -f "PeriopSignal.app/PeriopSignal" >/dev/null || break; sleep 0.5; done
            sleep 1
            # A launch that opens a page, a tab or a sheet, or jumps the tab (ShotReady, debug builds) leaves a "pending"
            # file in the app's tmp folder and a "ready" one once that has happened; on this Intel runner's simulator My
            # Patient can take 10 s or more to show, so such a shot waits past its time, up to 30 s more, for ready.
            local tmp; tmp=$(xcrun simctl get_app_container "$UDID" org.periopsignal.app data 2>/dev/null || true)
            [ -n "$tmp" ] && tmp="$tmp/tmp" && rm -f "$tmp/ps-shot-pending" "$tmp/ps-shot-ready"
            local started=$SECONDS
            xcrun simctl launch "$UDID" org.periopsignal.app "$@" >/dev/null || echo "::warning::launch failed for $name"
            sleep "$wait"
            if [ -n "$tmp" ] && [ -f "$tmp/ps-shot-pending" ]; then
              for _ in $(seq 1 60); do [ -f "$tmp/ps-shot-ready" ] && break; sleep 0.5; done
              [ -f "$tmp/ps-shot-ready" ] || echo "::warning::$name: the page it opens did not report ready"
            fi
            xcrun simctl io "$UDID" screenshot "build/shots/$name.png"
            # A filtered run keeps the app's screenshot trace (ShotTrace, debug builds) beside each shot.
            if [ -n "$ONLY" ]; then
              xcrun simctl spawn "$UDID" log show --last "$((SECONDS - started + 4))s" --style compact --predicate 'process == "PeriopSignal" AND category == "shots"' > "build/shots/$name-trace.txt" 2>/dev/null || true
            fi
            # The app is gone (it crashed): keep the newest crash report for this shot.
            if ! pgrep -f "PeriopSignal.app/PeriopSignal" >/dev/null; then
              crash=$(ls -t ~/Library/Logs/DiagnosticReports/PeriopSignal*.ips 2>/dev/null | head -1)
              if [ -n "$crash" ]; then cp "$crash" "build/shots/$name-crash.ips"; else echo "app not running, no crash report" > "build/shots/$name-crash.txt"; fi
              xcrun simctl spawn "$UDID" log show --last 1m --style compact --predicate 'process == "PeriopSignal"' > "build/shots/$name-log.txt" 2>/dev/null || true
            fi
            # Nothing drawn yet (a blank frame): record why, then try twice more. A blank frame shrinks to a tiny file
            # once scaled down, whatever the screen's resolution.
            blank () { sips -Z 300 "build/shots/$name.png" --out /tmp/ps-check.png >/dev/null 2>&1; [ "$(stat -f%z /tmp/ps-check.png 2>/dev/null || echo 0)" -lt 7000 ]; }
            for retry in 1 2; do
              if blank; then
                [ "$retry" = 1 ] && diag "$name"
                sleep 12
                xcrun simctl io "$UDID" screenshot "build/shots/$name.png"
              fi
            done
          }
          shot 01-feed 18 -ps.tips 0   # any -ps. argument marks a screenshot run, so the first-open tour stays off (1.8.1)
          shot 02-deepdive 12 -ps.openPost "$LANDMARK"
          shot 03-deepdive-limits 12 -ps.openPost "$LIMITS"
          shot 04-saved 12 -ps.presave "$LANDMARK" -ps.tab saved
          shot 05-more 10 -ps.tab more
          shot 06-widgets 12 -ps.screen widget
          shot 07-feed-day 12 -ps.forceAppearance light -ps.forceLaunchCount 2
          shot 08-cards 12 -ps.screen cards
          shot 09-welcome 13 -ps.showWelcome 1 -ps.forceAppearance dark
          shot 10-quiz 13 -ps.openQuiz 1
          shot 11-reference 12 -ps.tab reference
          shot 12-listen 13 -ps.listen 1
          shot 13-sharecard 13 -ps.screen sharecard
          shot 14-feed-foryou 13 -ps.topics.debug cardiac,criticalCare -ps.forceLaunchCount 5
          shot 15-rcri 12 -ps.ref score:rcri
          shot 16-peds 12 -ps.ref peds -ps.peds.weight 18 -ps.peds.years 5 -ps.peds.months 0
          shot 17-quickref 12 -ps.ref quickref:asra-anticoagulation
          shot 18-ariscat 12 -ps.ref score:ariscat
          shot 19-local 12 -ps.ref local -ps.la.weight 70
          shot 20-infusions 12 -ps.ref infusions -ps.la.weight 70
          shot 21-preop 12 -ps.ref folder:preoperative
          shot 22-neuraxial 12 -ps.ref neuraxial
          shot 23-fasting 12 -ps.ref fasting
          shot 24-last 12 -ps.ref quickref:asra-last -ps.la.weight 70
          shot 25-airway 12 -ps.ref airway
          shot 26-valves 12 -ps.ref valves
          shot 27-intervention 12 -ps.ref intervention
          shot 28-favorites 12 -ps.tab reference -ps.favorites.debug "valves,neuraxial,score:rcri"
          shot 29-regional 12 -ps.ref folder:regional
          shot 30-ponv 12 -ps.ref ponv -ps.ponv.factors "female,nonsmoker,opioids" -ps.ponv.agents "ondansetron,dexamethasone"
          shot 31-blood 12 -ps.ref infusions -ps.la.weight 70 -ps.inf.tab "Blood Products"
          shot 36-hematologic 12 -ps.ref infusions -ps.inf.tab Hematologic
          shot 37-medications-empty 12 -ps.ref infusions
          shot 32-local-empty 12 -ps.ref local
          shot 33-last-empty 12 -ps.ref quickref:asra-last
          shot 35-cardiothoracic 12 -ps.ref folder:cardiothoracic
          shot 38-chamber-rv 12 -ps.ref chamber -ps.echo.group rv -ps.echo.height 178 -ps.echo.weight 82 -ps.echo.values "rvb=4.5,rvm=3.9"
          shot 39-chamber-aorta 12 -ps.ref chamber -ps.echo.sex female -ps.echo.group ao -ps.echo.age 55 -ps.echo.height 165 -ps.echo.weight 60 -ps.echo.values "sov=3.6"
          shot 40-chamber-lv 12 -ps.ref chamber -ps.forceAppearance light -ps.echo.values "lvef=45,lvidd=60"
          shot 41-diastolic 12 -ps.ref diastolic -ps.dd.values "E=100,A=80,eSeptal=5,eLateral=6,tr=3.1"
          shot 42-diastolic-mac 12 -ps.ref diastolic -ps.dd.pop mac -ps.dd.values "E=80,A=80,ivrt=70"
          # 1.8.1 Reference polish: one-line empty headline, diastolic scope at the bottom and plain e′ cutoffs, captions behind ⓘ.
          shot 190-valves-mr-empty 12 -ps.ref valves -ps.vg.lesion mr -ps.forceAppearance light
          shot 191-diastolic-bottom 14 -ps.ref diastolic -ps.dd.values "E=100,A=80,eSeptal=5,eLateral=6,tr=3.1" -ps.dd.scroll bottom -ps.forceAppearance dark
          shot 192-diastolic-age 12 -ps.ref diastolic -ps.dd.age 40-65 -ps.forceAppearance light
          shot 193-intervention-captions 12 -ps.ref intervention -ps.forceAppearance dark
          shot 194-intervention-info 12 -ps.ref intervention -ps.vi.info sev -ps.forceAppearance light
          shot 195-stopbang-info 12 -ps.ref score:stopbang -ps.forceAppearance light
          # 1.8.1 wave 1 (shared components): group notes and the preset caption behind header ⓘ, the weight's ⓘ, all opened.
          # 220-229 are the UX waves' shots (200-214 are Studies).
          shot 220-wave1-airway-info 18 -ps.tab patient -ps.patient demo-rooms -ps.patient.case 3 -ps.patient.open airway -ps.evidence.open 1 -ps.forceAppearance dark
          shot 221-wave1-weight-info 12 -ps.ref quickref:asra-last -ps.la.weight 70 -ps.evidence.open 1 -ps.forceAppearance light
          # 1.8.2 Neurologic as an expanding page (222-229): the collapsed list, Stroke or TIA within 3 months and an
          # intracranial bleed with mass effect opened (light and dark), the History list, the Summary and Handoff lines, and a quick-add line.
          shot 222-neuro-collapsed 14 -ps.tab patient -ps.patient empty -ps.patient.open system:neuro -ps.forceAppearance light
          shot 223-neuro-stroke-ich-light 30 -ps.tab patient -ps.patient demo-neuro -ps.patient.open system:neuro -ps.forceAppearance light
          shot 224-neuro-stroke-ich-dark 30 -ps.tab patient -ps.patient demo-neuro -ps.patient.open system:neuro -ps.forceAppearance dark
          shot 225-neuro-history-list 14 -ps.tab patient -ps.patient demo-neuro -ps.patient.open history -ps.forceAppearance light
          shot 226-neuro-summary 16 -ps.tab patient -ps.patient demo-neuro -ps.patient.tab summary -ps.handoff.format full -ps.patient.scroll handoff -ps.forceAppearance light
          shot 227-neuro-handoff-dark 16 -ps.tab patient -ps.patient demo-neuro -ps.patient.tab summary -ps.handoff.format full -ps.patient.scroll handoff -ps.forceAppearance dark
          shot 228-neuro-quickadd 16 -ps.tab patient -ps.patient empty -ps.patient.tab preop -ps.forceAppearance dark -ps.quickadd "62M, subdural hematoma with midline shift, seizure, stroke 2 weeks ago"
          # 1.9 system pages (315-339, helper 1): every page expanding, light and dark; the CV, Respiratory and Neurologic
          # additions; the From Obstetric rows; the History list and the summary words.
          shot 315-renal-light 30 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:renal -ps.forceAppearance light
          shot 316-renal-dark 18 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:renal -ps.forceAppearance dark
          shot 317-gi-light 34 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:gi -ps.forceAppearance light
          shot 318-gi-dark 18 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:gi -ps.patient.scroll hx-cirrhosis -ps.forceAppearance dark
          shot 319-endo-light 18 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:endo -ps.forceAppearance light
          shot 320-endo-dark 18 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:endo -ps.patient.scroll hx-adrenal -ps.evidence.open 1 -ps.forceAppearance dark
          shot 321-heme-light 30 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:heme -ps.forceAppearance light
          shot 322-heme-dark 18 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:heme -ps.patient.scroll hx-anticoagulation -ps.forceAppearance dark
          shot 323-infectious-light 18 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:infectious -ps.forceAppearance light
          shot 324-infectious-dark 18 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:infectious -ps.patient.scroll hx-tb -ps.forceAppearance dark
          shot 325-acute-light 18 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:acute -ps.forceAppearance light
          shot 326-acute-dark 18 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:acute -ps.forceAppearance dark
          shot 327-ob-light 18 -ps.tab patient -ps.patient demo-ob19 -ps.patient.open system:ob -ps.forceAppearance light
          shot 328-ob-dark 18 -ps.tab patient -ps.patient demo-ob19 -ps.patient.open system:ob -ps.patient.scroll hx-gdm -ps.forceAppearance dark
          shot 329-msk-light 30 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:msk -ps.forceAppearance light
          shot 330-msk-dark 18 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:msk -ps.forceAppearance dark
          shot 331-social-light 18 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:social -ps.forceAppearance light
          shot 332-social-dark 18 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:social -ps.forceAppearance dark
          shot 333-cv-af-pacer-light 30 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:cv -ps.patient.scroll hx-endocarditis -ps.forceAppearance light
          shot 334-resp-pleural-dark 30 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:resp -ps.patient.scroll hx-ild -ps.forceAppearance dark
          shot 335-neuro-additions-light 18 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open system:neuro -ps.patient.scroll hx-sci -ps.forceAppearance light
          shot 336-cv-from-ob-dark 18 -ps.tab patient -ps.patient demo-ob19 -ps.patient.open system:cv -ps.patient.scroll hx-cardiac-surgery -ps.forceAppearance dark
          shot 337-heme-from-ob-light 18 -ps.tab patient -ps.patient demo-ob19 -ps.patient.open system:heme -ps.patient.scroll hx-declines-blood -ps.forceAppearance light
          shot 338-pages-history-list 18 -ps.tab patient -ps.patient demo-pages19 -ps.patient.open history -ps.forceAppearance light
          shot 339-renal-empty-dark 18 -ps.tab patient -ps.patient empty -ps.patient.open system:renal -ps.forceAppearance dark
          # 1.8.1 wave 2a (Reference tools, 230-239): short one-line headers, summaries and captions behind ⓘ (opened with
          # -ps.evidence.open 1), the ACLS protocol note with its not-recommended lines kept in view, the finder's empty state.
          shot 230-wave2a-airway-ref 12 -ps.ref quickref:asa-difficult-airway -ps.forceAppearance dark
          shot 231-wave2a-fasting-ref 12 -ps.ref quickref:asa-fasting -ps.forceAppearance light
          shot 232-wave2a-acls-info 12 -ps.ref acls -ps.evidence.open 1 -ps.forceAppearance light
          shot 233-wave2a-regional-empty 12 -ps.ref regional-finder -ps.forceAppearance dark
          shot 234-wave2a-ob-hypertension 12 -ps.ref ob -ps.ob.event hypertension -ps.forceAppearance light
          shot 235-wave2a-chamber-info 18 -ps.ref chamber -ps.echo.group rvf -ps.echo.values "tapse=1.5" -ps.echo.pasp 45 -ps.echo.scroll coupling -ps.evidence.open 1 -ps.forceAppearance dark
          shot 236-wave2a-local-info 12 -ps.ref local -ps.la.weight 70 -ps.evidence.open 1 -ps.forceAppearance light
          shot 237-wave2a-neuraxial-info 12 -ps.ref neuraxial-guide -ps.nx.proc cesarean -ps.evidence.open 1 -ps.forceAppearance dark
          shot 238-wave2a-abg-normal 12 -ps.ref abg -ps.abg.values "ph=7.40,paco2=40,hco3=24" -ps.forceAppearance light
          shot 239-wave2a-ponv-info 12 -ps.ref ponv -ps.ponv.factors "female,nonsmoker,opioids" -ps.ponv.agents "ondansetron,dexamethasone" -ps.evidence.open 1 -ps.forceAppearance dark
          shot 400-labs-results-light 20 -ps.tab patient -ps.patient demo-labs -ps.patient.open workup:labs -ps.patient.scroll labs-results -ps.forceAppearance light
          shot 401-labs-results-dark 16 -ps.tab patient -ps.patient demo-labs -ps.patient.open workup:labs -ps.patient.scroll labs-results -ps.forceAppearance dark
          shot 402-labs-handoff 16 -ps.tab patient -ps.patient demo-labs -ps.patient.tab summary -ps.handoff.format full -ps.patient.scroll handoff -ps.forceAppearance light
          shot 403-labs-quickadd 16 -ps.tab patient -ps.patient empty -ps.patient.tab preop -ps.forceAppearance light -ps.quickadd "Hbg 12.1, Cr 1, lac 1.4, T&S A-/-, 2u xm, staph neg, MRSA screen negative, covid negative, C diff pending, VRE positive"
          shot 404-labs-estimate 16 -ps.tab patient -ps.patient demo-labs -ps.patient.open workup:labs -ps.evidence.open 1 -ps.forceAppearance light
          shot 405-labs-handoff-short-dark 16 -ps.tab patient -ps.patient demo-labs -ps.patient.tab summary -ps.handoff.format short -ps.patient.scroll handoff -ps.forceAppearance dark
          # 1.8.1 wave 3 (My Patient editors, 250-259): each moved explanation opened (-ps.evidence.open 1).
          shot 250-wave3-assessment-info 18 -ps.tab patient -ps.patient demo -ps.patient.open assessment -ps.evidence.open 1 -ps.forceAppearance dark
          shot 251-wave3-code-status-info 18 -ps.tab patient -ps.patient demo-dnr -ps.patient.open assessment -ps.patient.scroll codestatus -ps.evidence.open 1 -ps.forceAppearance light
          shot 252-wave3-intraop-airway-info 16 -ps.tab patient -ps.patient demo -ps.patient.open intraop:airway -ps.evidence.open 1 -ps.forceAppearance light
          shot 253-wave3-tee-info 14 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open workup:tee -ps.evidence.open 1 -ps.forceAppearance light
          shot 254-wave3-note-compose-info 14 -ps.tab patient -ps.patient empty -ps.patient.open note -ps.evidence.open 1 -ps.forceAppearance dark
          shot 255-wave3-note-check-info 16 -ps.tab patient -ps.patient empty -ps.patient.open note -ps.patient.note example -ps.evidence.open 1 -ps.forceAppearance light
          shot 256-wave3-end-case-info 16 -ps.tab patient -ps.patient demo-rooms -ps.patient.open end-case -ps.evidence.open 1 -ps.forceAppearance light
          shot 257-wave3-airway-secured-info 16 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open airway -ps.patient.scroll done -ps.evidence.open 1 -ps.forceAppearance dark
          shot 258-wave3-procedure-info 14 -ps.tab patient -ps.patient demo -ps.patient.open procedure -ps.patient.addproc TKA -ps.evidence.open 1 -ps.forceAppearance light
          shot 259-wave3-support-empty-info 18 -ps.tab patient -ps.patient demo -ps.patient.open devices:support -ps.patient.scroll done -ps.evidence.open 1 -ps.forceAppearance dark
          # 1.8.1 features (260-269): Trivial regurgitation, infusions typed in one line, the Foley, Bentall's valve, the
          # lines figure in the handoff; each in light and dark.
          shot 260-f181-echo-trivial 16 -ps.tab patient -ps.patient demo-cardiac -ps.patient.edit echo-trivial -ps.patient.open workup:echo -ps.patient.scroll echo-t -ps.forceAppearance light
          shot 261-f181-echo-trivial-dark 16 -ps.tab patient -ps.patient demo-cardiac -ps.patient.edit echo-trivial -ps.patient.open workup:echo -ps.patient.scroll echo-m -ps.forceAppearance dark
          shot 262-f181-infusion-type 16 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open intraop:infusions -ps.infusion.type "norepi 0.05, vaso 0.04, levo 0.1" -ps.forceAppearance light
          shot 263-f181-infusion-type-dark 16 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open intraop:infusions -ps.infusion.type "epi 1, milri 0.25, insulin 4 u/hr" -ps.forceAppearance dark
          shot 264-f181-devices-foley 16 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open devices:preop -ps.forceAppearance light
          shot 265-f181-devices-foley-typed 20 -ps.tab patient -ps.patient demo-cardiac -ps.patient.open intraop:lines -ps.patient.scroll devicetype -ps.devices.type "suprapubic foley 14" -ps.forceAppearance dark
