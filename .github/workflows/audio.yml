name: Post audio

# Reads each new post aloud with a neural voice and links the MP3 from posts.json. Default engine:
# Kokoro-82M (open weights, runs on the runner's CPU, no account). Set the repository variable
# TTS_ENGINE=google plus the GOOGLE_TTS_API_KEY secret for Google's Chirp 3 HD voices instead
# (ios/OWNER_RUNBOOK.md, section 9). MP3s live in the repository's "audio" release.

on:
  push:
    branches: [main]
    paths: ["posts.json"]
  schedule:
    - cron: "45 10 * * *"   # after the citations pass; also works through any backlog
  workflow_dispatch:
    inputs:
      all:
        description: "Regenerate every post (true/false), e.g. after changing the voice"
        default: "false"
      limit:
        description: "At most this many posts this run (blank = the default batch of 70)"
        default: ""
      voice:
        description: "Voice name (blank = the TTS_VOICE repository variable or the engine's default)"
        default: ""
      engine:
        description: "kokoro or google (blank = the TTS_ENGINE repository variable or kokoro)"
        default: ""

concurrency:
  group: posts-json
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TTS_ENGINE: ${{ inputs.engine || vars.TTS_ENGINE || 'kokoro' }}
      TTS_VOICE: ${{ inputs.voice || vars.TTS_VOICE }}
      KOKORO_DIR: ${{ github.workspace }}/.kokoro
    steps:
      - uses: actions/checkout@v4

      - name: Skip when nothing is pending
        id: pending
        run: |
          PENDING=$(python3 -I tools/synthesize_audio.py posts.json --dry-run $([ "${{ inputs.all }}" = "true" ] && echo --all) | head -1)
          echo "$PENDING"
          case "$PENDING" in 0\ post*) echo "go=false" >> "$GITHUB_OUTPUT" ;; *) echo "go=true" >> "$GITHUB_OUTPUT" ;; esac

      - uses: actions/setup-python@v5
        if: steps.pending.outputs.go == 'true' && env.TTS_ENGINE == 'kokoro'
        with:
          python-version: "3.12"

      - name: Kokoro model files (cached)
        if: steps.pending.outputs.go == 'true' && env.TTS_ENGINE == 'kokoro'
        id: cache
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-model-files-v1.1

      - name: Install Kokoro
        if: steps.pending.outputs.go == 'true' && env.TTS_ENGINE == 'kokoro'
        run: |
          pip install --quiet kokoro-onnx soundfile numpy
          mkdir -p .kokoro
          if [ ! -s .kokoro/kokoro-v1.0.onnx ]; then
            curl -sSL -o .kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
            curl -sSL -o .kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          fi
          ls -la .kokoro

      - name: Synthesize and upload
        if: steps.pending.outputs.go == 'true'
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          ffmpeg -version | head -1
          ARGS="--limit ${{ inputs.limit || '70' }}"
          [ "${{ inputs.all }}" = "true" ] && ARGS="$ARGS --all"
          python3 -I tools/synthesize_audio.py posts.json $ARGS 2>&1 | tee audio.log
          python3 -I tools/validate_posts.py posts.json
          {
            echo "## Post audio"
            grep -E "to synthesize|synthesized|FAILED" audio.log | head -40
          } >> "$GITHUB_STEP_SUMMARY"
          # Fail loudly when nothing could be made.
          if grep -qE "^synthesized 0, failed [1-9]" audio.log; then echo "::error::every post failed; see audio.log on the ci-results branch"; exit 1; fi

      - name: Keep the log on the ci-results branch
        if: always() && steps.pending.outputs.go == 'true'
        run: |
          git config user.name "periop-signal-ci"
          git config user.email "ci@periopsignal.invalid"
          W="$RUNNER_TEMP/ci-results"
          if git fetch -q origin ci-results 2>/dev/null; then git worktree add -q "$W" origin/ci-results; else git worktree add -q --detach "$W" && git -C "$W" checkout -q --orphan ci-results && git -C "$W" rm -rfq --cached . >/dev/null 2>&1 || true; fi
          mkdir -p "$W/results/audio"
          cp audio.log "$W/results/audio/last-run.log" 2>/dev/null || echo "(no log)" > "$W/results/audio/last-run.log"
          git -C "$W" add -f results/audio && git -C "$W" commit -q -m "Audio log for run ${{ github.run_number }}" || true
          git -C "$W" push -q origin HEAD:ci-results || { git -C "$W" fetch -q origin ci-results && git -C "$W" rebase -q origin/ci-results && git -C "$W" push -q origin HEAD:ci-results; } || true
          git worktree remove --force "$W" || true

      - name: Commit the audio links
        if: steps.pending.outputs.go == 'true'
        run: |
          [ -s audio-updates.json ] || { echo "No new links to commit."; exit 0; }
          git config user.name "periop-signal-ci"
          git config user.email "ci@periopsignal.invalid"
          SUMMARY="$(grep -E '^synthesized' audio.log | head -1)"
          for i in 1 2 3 4; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            python3 -I tools/apply_audio_updates.py audio-updates.json posts.json
            python3 -I tools/validate_posts.py posts.json
            git diff --quiet -- posts.json && { echo "Already on main."; exit 0; }
            git add posts.json
            git commit -q -m "Audio: $SUMMARY"
            git push -q origin HEAD:main && exit 0
            echo "push refused, retrying"; sleep 10
          done
          exit 1
