name: Notify app users of new posts

on:
  push:
    branches: [main]
    paths: ["posts.json"]
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send a test notification instead of diffing posts.json (true/false)"
        default: "false"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Skip when Firebase is not configured
        id: gate
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "No FIREBASE_SERVICE_ACCOUNT secret; nothing to send."; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          fetch-depth: 2

      - name: Work out what is new
        if: steps.gate.outputs.go == 'true'
        id: diff
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, subprocess, os
          test = os.environ.get("TEST", "false") == "true"
          cur = json.load(open("posts.json", encoding="utf-8"))["posts"]
          try:
              prev_raw = subprocess.run(["git", "show", "HEAD~1:posts.json"], capture_output=True, text=True, check=True).stdout
              prev_ids = {p["id"] for p in json.loads(prev_raw)["posts"]}
          except Exception:
              prev_ids = {p["id"] for p in cur}  # first run: nothing counts as new
          new = [p for p in cur if p["id"] not in prev_ids]
          if test and not new:
              new = cur[:1]
          new.sort(key=lambda p: (p.get("impact", 1), p.get("date", "")), reverse=True)
          if not new:
              print("count=0"); raise SystemExit
          lead = new[0]
          title = "New in Periop Signal" if len(new) == 1 else f"{len(new)} new papers in Periop Signal"
          if lead.get("impact") == 3: title = "Landmark paper · " + lead.get("journal", "")
          body = lead["headline"]
          print(f"count={len(new)}")
          print(f"title={title}")
          print("body<<B\n" + body + "\nB")
          print(f"post_id={lead['id']}")
          EOF
        env:
          TEST: ${{ inputs.test_message }}

      - name: Send through Firebase Cloud Messaging
        if: steps.gate.outputs.go == 'true' && steps.diff.outputs.count != '0'
        env:
          TITLE: ${{ steps.diff.outputs.title }}
          BODY: ${{ steps.diff.outputs.body }}
          POST_ID: ${{ steps.diff.outputs.post_id }}
          COUNT: ${{ steps.diff.outputs.count }}
        run: |
          pip3 install --quiet google-auth requests
          python3 - <<'EOF'
          import json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          sa = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
          creds = service_account.Credentials.from_service_account_info(sa, scopes=["https://www.googleapis.com/auth/firebase.messaging"])
          creds.refresh(Request())
          project = sa["project_id"]
          msg = {
            "message": {
              "topic": "new-posts",
              "notification": {"title": os.environ["TITLE"], "body": os.environ["BODY"]},
              "data": {"postID": os.environ["POST_ID"], "count": os.environ["COUNT"]},
              "apns": {
                "headers": {"apns-priority": "10"},
                "payload": {"aps": {"sound": "default", "thread-id": "periop-signal", "mutable-content": 1}}
              }
            }
          }
          r = requests.post(f"https://fcm.googleapis.com/v1/projects/{project}/messages:send",
                            headers={"Authorization": "Bearer " + creds.token, "Content-Type": "application/json"},
                            data=json.dumps(msg), timeout=30)
          print(r.status_code, r.text[:500])
          r.raise_for_status()
          EOF
