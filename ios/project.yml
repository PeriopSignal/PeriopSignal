name: PeriopSignal
options:
  bundleIdPrefix: org.periopsignal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.4.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

targets:
  PeriopSignal:
    type: application
    platform: iOS
    sources:
      - path: PeriopSignal
      - path: Shared
      - path: ../reference.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.periopsignal.app
        PRODUCT_NAME: PeriopSignal
        PRODUCT_MODULE_NAME: PeriopSignal
        INFOPLIST_FILE: PeriopSignal/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PeriopSignal/Resources/PeriopSignal.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PeriopSignalWidget
        embed: true
        codeSign: true

  PeriopSignalWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PeriopSignalWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.periopsignal.app.widget
        PRODUCT_NAME: PeriopSignalWidget
        INFOPLIST_FILE: PeriopSignalWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PeriopSignalWidget/PeriopSignalWidget.entitlements
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground

  PeriopSignalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["Fixtures/**"]
      - path: Tests/Fixtures/posts-sample.json
        buildPhase: resources
      - path: ../reference.json
        buildPhase: resources
    dependencies:
      - target: PeriopSignal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.periopsignal.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PeriopSignal:
    build:
      targets:
        PeriopSignal: all
        PeriopSignalWidget: all
        PeriopSignalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PeriopSignalTests
    archive:
      config: Release
